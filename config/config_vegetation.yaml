# Vegetation Detection Configuration
# Optimized for trees, shrubs, and forest canopy detection
# from RGB satellite imagery at 0.1m resolution

data:
  # Input processing
  input_size: 256                    # Tile size in pixels (512px = 51.2m at 0.1m res)
  channels: 3                        # Input RGB channels
  num_classes: 1                     # Binary (vegetation vs background)
  
  # Data split
  validation_split: 0.2              # 80% train, 20% validation
  test_split: 0.0                    # Can be set later for final evaluation
  random_state: 42                   # Reproducibility
  
  # Batch processing
  batch_size: 1                    # Increase if GPU memory allows (16, 32)
  num_workers: 4                     # Parallel data loading
  pin_memory: true                   # Faster GPU data transfer

model:
  # Architecture
  encoder: senet154                  # SENet154 vs ResNet50 (better for vegetation)
  decoder_type: unetplusplus        # U-Net++ vs U-Net (better for small objects)
  decoder_attention: scse            # Spatial and Channel Squeeze-Excitation
  
  # Input adaptation
  use_channel_adapter: true          # Adapt 7 channels (RGB + indices) to 3
  freeze_encoder: true               # Freeze ImageNet weights initially
  
  # Learning
  learning_rate: 0.001               # Initial LR for stage 1
  learning_rate_stage2: 0.0001       # Reduced LR for fine-tuning
  optimizer: adamw                   # AdamW with weight decay
  weight_decay: 0.0001               # L2 regularization
  gradient_clip: 1.0                 # Gradient clipping
  
  # Activation
  activation: sigmoid                # Binary segmentation
  
training:
  # Stage 1: Frozen backbone (feature extraction learning)
  stage1_epochs: 10                  # Quick warmup
  stage1_warmup_epochs: 2            # Learning rate warmup
  
  # Stage 2: Fine-tuning (full model)
  epochs: 150                        # Total additional epochs
  early_stopping_patience: 15        # Stop if no improvement
  
  # Learning rate scheduling
  lr_scheduler: cosine_annealing     # Cosine with warm restarts
  T_0: 10                            # Initial period
  T_mult: 2                          # Multiply period by this
  min_lr: 1e-8                       # Minimum learning rate
  
  # Loss function weights (learned during training but initial values)
  loss_alpha: 1.0                    # BCE weight
  loss_beta: 1.0                     # Dice weight
  loss_gamma: 0.5                    # Boundary loss weight
  loss_delta: 0.5                    # Focal loss weight
  
  # Monitoring
  reduce_lr_patience: 5              # Epochs before reducing LR
  reduce_lr_factor: 0.5              # Multiply LR by this
  min_lr_plateau: 1e-8               # Minimum LR for plateau

# Inference
inference:
  # Tile processing
  tile_size: 512                     # Tile size for inference
  overlap: 64                        # Overlap in pixels (12.5%)
  
  # Post-processing
  confidence_threshold: 0.5          # Threshold for binary map
  #   0.3-0.4: Liberal (include potential vegetation)
  #   0.5: Balanced (recommended)
  #   0.6-0.7: Conservative (only confident)
  
  # Output
  output_probability: true           # Save confidence map
  output_binary: true                # Save binary thresholded map
  output_rgb_composite: false        # Save RGB + prediction composite
  
  # Device
  device: cuda                       # cuda or cpu
  mixed_precision: false             # Automatic mixed precision (faster, less memory)

# Data augmentation
augmentation:
  # Geometric transforms
  horizontal_flip: 0.5               # Probability
  vertical_flip: 0.5
  random_rotate90: 0.3               # 0/90/180/270 deg
  rotate: 45                         # Random rotation up to 45 deg
  
  # Shift, scale, rotate
  shift_limit: 0.1                   # 10% shift
  scale_limit: 0.15                  # 15% scale
  rotate_limit: 15                   # 15 deg
  shift_scale_rotate_prob: 0.5
  
  # Photometric transforms
  brightness_limit: 0.25             # ±25%
  contrast_limit: 0.35               # ±35%
  brightness_contrast_prob: 0.6
  
  # Color transforms
  hue_shift_limit: 15                # Hue shift
  sat_shift_limit: 25                # Saturation shift
  val_shift_limit: 15                # Value shift
  hsv_prob: 0.4
  
  # Noise
  gauss_noise_var: [5.0, 15.0]      # Variance range
  gauss_noise_prob: 0.2
  
  gaussian_blur_limit: 3             # Kernel size
  gaussian_blur_prob: 0.15
  
  # Spatial transforms
  elastic_alpha: 1                   # Elasticity strength
  elastic_sigma: 50                  # Elasticity smooth
  elastic_prob: 0.1
  
  # Channel manipulation
  channel_dropout_prob: 0.1          # Simulate missing bands
  
  # Crops
  random_crop_prob: 0.2
  random_crop_size: 512

# Vegetation-specific indices
vegetation_indices:
  compute_exg: true                  # Excess Green: 2G - R - B
  compute_ndvi_rgb: true             # NDVI-like from RGB: (G-R)/(G+R)
  compute_gli: true                  # Green Leaf Index
  compute_color_index: true          # Color Index: G/(R+B)
  
  # Normalization of indices
  percentile_lower: 1                # Lower percentile
  percentile_upper: 99               # Upper percentile

# Logging and checkpointing
logging:
  log_dir: ./logs                    # Log directory
  save_logs: true                    # Save training logs
  log_frequency: 100                 # Log every N batches
  tensorboard: false                 # Enable TensorBoard
  
  # Model checkpointing
  save_best_model: true              # Save best validation model
  save_frequency: 5                  # Save every N epochs
  keep_best_n: 3                     # Keep N best models

# Metrics
metrics:
  # Thresholds for binary evaluation
  binary_threshold: 0.5
  
  # Metrics to compute
  compute_iou: true
  compute_f1: true
  compute_precision: true
  compute_recall: true
  
  # IoU threshold for edge cases
  iou_threshold: 0.5

# File paths (modify as needed)
paths:
  config_file: config/config_v1.yaml
  tiles_dir: ./tiles_masks/tiles_veg
  masks_dir: ./tiles_masks/masks_veg
  model_dir: ./models
  log_dir: ./logs
  predictions_dir: ./predictions

# Vegetation-specific parameters
vegetation:
  # Focus on detecting
  detect_trees: true                 # Individual trees
  detect_shrubs: true                # Shrubs/bushes
  detect_forest_canopy: true         # Forest patches
  detect_small_trees: true           # Small objects
  
  # Minimum size (pixels)
  min_tree_size: 4                   # Minimum tree crown size
  
  # Post-processing
  morphological_closing: false       # Fill small holes
  morphological_opening: false       # Remove small noise
  kernel_size: 5                     # Morphological kernel size
  
  # Smoothing
  apply_crf: false                   # Conditional Random Field
  crf_iterations: 5

# Advanced
advanced:
  # Mixed precision training (faster, less memory)
  use_amp: false
  
  # Distributed training
  distributed: false
  world_size: 1
  
  # Reproducibility
  deterministic: true
  seed: 42
  
  # Performance
  benchmark: true
  cudnn_enabled: true

# Notes for users
notes: |
  
  This configuration is optimized for vegetation detection (trees, shrubs) from RGB
  satellite imagery at 0.1m resolution.
  
  Key features:
  - 512×512 tiles (51.2m × 51.2m at 0.1m resolution)
  - 4 vegetation indices computed from RGB
  - U-Net++ architecture with SCSE attention
  - Adaptive loss function (BCE + Dice + Boundary + Focal)
  - Aggressive data augmentation
  - Two-stage training (frozen → fine-tune)
  
  To modify:
  1. Adjust batch_size if GPU memory differs
  2. Change tile_size if using different resolution (size_in_meters / resolution_in_meters)
  3. Tune augmentation probabilities based on data variability
  4. Adjust learning rates if convergence is too slow/fast
  5. Increase epochs if model needs more training
  
  Expected training time: 1-5 hours (depending on GPU and dataset size)
  Expected inference time: 5-30 minutes (depending on image size and GPU)
